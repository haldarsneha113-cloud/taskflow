<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskflow API Tester</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        input, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #2da44e; color: white; border: none; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background: #f6f8fa; border: 1px solid #d0d7de; }
    </style>
</head>
<body>
    <h2>Taskflow API Tester</h2>
    
    <label>Enter Numbers (comma-separated):</label>
    <input type="text" id="numbers" placeholder="e.g. 5, 2, 9, 1, 3">
    
    <button onclick="sortNumbers()">Sort Array</button>
    
    <label>Search Target:</label>
    <input type="text" id="target" placeholder="e.g. 9">
    <button onclick="searchNumber()">Search Target</button>

    <div class="result" id="output">Results will appear here...</div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function sortNumbers() {
            const rawInput = document.getElementById("numbers").value;
            const arr = rawInput.split(',').map(num => parseInt(num.trim())).filter(n => !isNaN(n));
            
            const response = await fetch(`${API_URL}/sort`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ array: arr })
            });
            const data = await response.json();
            document.getElementById("output").innerText = JSON.stringify(data, null, 2);
        }

        async function searchNumber() {
            const rawInput = document.getElementById("numbers").value;
            const target = parseInt(document.getElementById("target").value);
            const arr = rawInput.split(',').map(num => parseInt(num.trim())).filter(n => !isNaN(n));

            const response = await fetch(`${API_URL}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ array: arr, target: target })
            });
            const data = await response.json();
            document.getElementById("output").innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
